<!-- landing.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingo - Language Learning Cards</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <header class="text-center py-10 bg-blue-600 text-white">
        <h1 class="text-4xl font-bold">Lingo</h1>
        <p class="text-lg">Generate language learning cards for Anki</p>
    </header>
    
    <main class="container mx-auto mt-10">
        <section id="demo">
            <h2 class="text-2xl font-semibold">Demo: Generate a Card</h2>
            <form hx-post="/generate" hx-target="#card-preview" class="mt-4">
                <div class="mb-4">
                    <label for="languagePair" class="block text-sm font-medium">Select Language Pair</label>
                    <select id="languagePair" name="languagePair" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        <option value="en-es">English to Spanish</option>
                        <option value="en-fr">English to French</option>
                        <!-- Add more language pairs here -->
                    </select>
                </div>
                <div class="mb-4">
                    <label for="word" class="block text-sm font-medium">Enter a word</label>
                    <input type="text" id="word" name="word" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                </div>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md">Generate Card</button>
            </form>

            <div id="card-preview" class="mt-8">
                <!-- Card will be rendered here -->
            </div>
        </section>
        
        <section id="bulk-generator" class="mt-12">
            <h2 class="text-2xl font-semibold">Generate Cards for Anki</h2>
            <form hx-post="/generate-apkg" hx-target="#download-link" class="mt-4">
                <div class="mb-4">
                    <label for="words" class="block text-sm font-medium">Enter words (comma-separated)</label>
                    <textarea id="words" name="words" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" rows="4"></textarea>
                </div>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md">Generate APKG</button>
            </form>

            <div id="download-link" class="mt-8">
                <!-- Download link for APKG will be displayed here -->
            </div>
        </section>
    </main>
</body>
</html>
