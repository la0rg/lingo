{{ if .MissingWords }}
<div class="bg-base-100 collapse collapse-arrow rounded-lg border border-neutral">
    <input type="checkbox" class="peer" />
    <div class="collapse-title flex flex-row flex-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="h-6 w-6 shrink-0 stroke-info">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
        </svg>
        <span class="ml-2">The following words could not be processed</span>
    </div>
    <div class="collapse-content">
        <ul class="list-inside list-disc">
            {{ range .MissingWords }}
            <li>{{ . }}</li>
            {{ end }}
        </ul>
    </div>
</div>
{{ end }}
<div id="actions" class="card-actions justify-center htmx-content space-x-0 md:space-x-6">
    <a class="btn btn-info w-full md:w-56" onclick="copyAPKG()">Copy URL</a>
    <div class="indicator w-full md:w-56">
        {{ if ne .CardsCount .RequestedCount }}
        <span class="indicator-item badge badge-warning">{{ .CardsCount }}/{{ .RequestedCount }}</span>
        {{ end }}
        <a id="apkg-download" class="btn btn-success w-full md:w-56" href="{{ .URL }}" download>Download the APKG
            file</a>
    </div>
    <a class="btn btn-outline btn-ghost w-full md:w-56" href="/collection">New collection</a>
</div>
