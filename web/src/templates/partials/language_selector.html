<form id="language-selector" class="z-10">
    <ul class="menu menu-horizontal bg-base-200 rounded-lg">
        <li>
            <details id="source-language">
                {{ range .Languages -}}
                {{ if eq .CountryCode $.SourceCountryCode }}
                <summary>
                    Study:
                    <input type="hidden" name="source" value="{{ .CountryCode }}">
                    <span class="fi fi-{{ .Flag }} 123"></span>
                </summary>
                {{ end }}
                {{- end }}
                <ul>
                    {{ range .Languages -}}
                    <li>
                        <button type="submit" {{ if eq .CountryCode $.SourceCountryCode
                            -}}class="menu-active cursor-pointer" {{- end }} hx-post="/language"
                            hx-target="#language-selector" hx-swap="outerHTML"
                            hx-vals='{"sourceNew": "{{ .CountryCode }}"}'>
                            <span class="fi fi-{{ .Flag }}"></span>{{ .Name }}
                        </button>
                    </li>
                    {{- end }}
                </ul>
            </details>
        </li>
        <li>
            <details id="target-language">
                {{ range .Languages -}}
                {{ if eq .CountryCode $.TargetCountryCode }}
                <summary>
                    Native:
                    <input type="hidden" name="target" value="{{ .CountryCode }}">
                    <span class="fi fi-{{ .Flag }}"></span>
                </summary>
                {{ end }}
                {{- end }}
                <ul>
                    {{ range .Languages -}}
                    <li>
                        <button type="submit" {{ if eq .CountryCode $.TargetCountryCode}}
                            class="menu-active cursor-pointer" {{ end }} hx-post="/language"
                            hx-target="#language-selector" hx-swap="outerHTML"
                            hx-vals='{"targetNew": "{{ .CountryCode }}"}'>
                            <span class="fi fi-{{ .Flag }}"></span>{{ .Name }}
                        </button>
                    </li>
                    {{- end }}
                </ul>
            </details>
        </li>
    </ul>
</form>
