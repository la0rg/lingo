{{ define "base" }}
<!DOCTYPE html>
<html lang="en" data-theme="sunset">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Create Anki flashcards instantly with AI-powered translations and examples. Learn languages effectively with context-rich cards, multiple language support, and personalized collections.">
    <meta name="keywords"
        content="Anki flashcards, language learning, AI translations, spaced repetition, vocabulary cards">
    <meta name="author" content="Aleksei Lanbin">
    <meta property="og:title" content="Lingo - AI-Powered Flashcards for Anki">
    <meta property="og:description"
        content="Create Anki flashcards instantly with AI-powered translations and examples. Learn languages effectively with context-rich cards.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lingo.lanbin.dev">
    <title>{{block "title" .}}Lingo - AI-Powered Flashcards for Anki{{end}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"
        defer></script>
    <script src="https://unpkg.com/htmx-ext-response-targets@2.0.0/response-targets.js" defer></script>
    <script src="/public/js/language_selector.js" defer></script>
    <link rel="icon" href="/public/favicon.svg">
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:wght@100&display=swap"
        rel="stylesheet">
</head>

<body class="min-h-screen flex flex-col font-main font-thin">
    <header>
        <div class="navbar px-8 bg-base-100">
            <div class="navbar-start">
                <h1 class="text-2xl font-semibold text-slate-100 font-title"><a href="/">lingo</a></h1>
            </div>

            {{ if .LanguageSelector }}
            <div class="navbar-center">
                {{ template "language_selector.html" .LanguageSelector }}
            </div>
            {{ end }}

            <div class="navbar-end space-x-6">
                <a class="group" aria-label="GitHub" href="https://github.com/la0rg/lingo">
                    <svg aria-hidden="true" viewBox="0 0 16 16"
                        class="h-6 w-6 fill-slate-400 group-hover:fill-slate-200">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z">
                        </path>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    {{ template "content" . }}

    <footer class="footer footer-center bg-base-300 text-neutral-content p-4">
        <aside>
            <p>
                Made with <a class="link" href="https://go.dev/">Go</a>, powered by <a class="link"
                    href="https://openai.com/">OpenAI</a><br>
                2025 Aleksei Lanbin
            </p>
        </aside>
    </footer>

</body>

</html>
{{ end }}
