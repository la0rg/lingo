root = "."
testdata_dir = "testdata"
tmp_dir = ".bin"

[build]
args_bin = []
bin = "./.bin/lingo"
cmd = "go build -o .bin/lingo cmd/server/main.go"
delay = 1000
exclude_dir = [".vscode", ".bin", "web/node_modules"]
exclude_file = []
exclude_regex = ["_test.go"]
include_ext = ["go", "html", "css", "js"]
log = "build-errors.log"
